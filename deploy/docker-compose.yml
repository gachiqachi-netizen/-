services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ./app.env
    ports:
      - "127.0.0.1:8800:8800"
    volumes:
      - ./data/app:/data
      - ./secrets:/secrets:ro
      - ../tools/check_deploy.py:/app/tools/check_deploy.py:ro
      - ../tools/load_seed.py:/app/tools/load_seed.py:ro
      - ../tools/load_templates.py:/app/tools/load_templates.py:ro
      - ../tools/patch_beads.py:/app/tools/patch_beads.py:ro
      - ./data-files:/app/deploy-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?在 app.env 填写数据库用户名}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 app.env 填写数据库密码}
      POSTGRES_DB: ${POSTGRES_DB:?在 app.env 填写数据库名}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
