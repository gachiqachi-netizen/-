<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>串个珠后台</title>
<style>
/* 运营后台：沿用《串个珠设计规范》的颜色和字号；桌面两栏（列表 + 编辑），订单/审计等宽表单栏 */
:root {
  --ground: #f7f6f4; --surface: #ffffff; --tray: #efece8; --tray-deep: #e3ded8; --line: #e6e2dd; --line-strong: #8f8781;
  --ink: #1f1b1a; --ink-2: #5e5753; --ink-3: #736b66; --brand: #c8302e; --brand-pressed: #a82522; --brand-tint: #fbecea; --on-brand: #fff;
  --fit-ok: #2b7a4b; --fit-warn: #9a5800; --danger: #b42318;
  --font-sans: "PingFang SC", -apple-system, "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --font-num: "DIN Alternate", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 14px/20px var(--font-sans); }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 20px; padding: 0 24px; height: 56px; overflow-x: auto; }
header h1 { font: 600 16px/24px var(--font-sans); margin: 0; white-space: nowrap; }
header nav { display: flex; gap: 2px; }
header nav button { border: 0; background: none; height: 56px; padding: 0 12px; font: 400 14px/20px var(--font-sans); color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
header nav button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--brand); }
header .right { margin-left: auto; display: flex; gap: 12px; align-items: center; white-space: nowrap; }
header a { color: var(--ink-2); font-size: 13px; }
.ai-state { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--tray); color: var(--ink-2); }
.ai-state.on { background: #e7f4ec; color: var(--fit-ok); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 24px; padding: 24px; max-width: 1440px; margin: 0 auto; align-items: start; }
main.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
h2 { font: 600 16px/24px var(--font-sans); margin: 0; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.bar .grow { flex: 1; }
.btn { height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid transparent; background: var(--brand); color: var(--on-brand); font: 600 14px/20px var(--font-sans); cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn.text { background: none; color: var(--ink-2); padding: 0 8px; font-weight: 400; }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font: 400 13px/18px var(--font-sans); cursor: pointer; color: var(--ink-2); }
.chip.on { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-pressed); font-weight: 600; }
.chip.chip-danger { color: var(--danger); border-color: var(--danger); }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.row { background: var(--surface); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; cursor: pointer; border: 1.5px solid transparent; text-align: left; font: inherit; color: inherit; }
.row.on { border-color: var(--brand); }
.row .nm { font-weight: 600; }
.row .sub { font-size: 12px; color: var(--ink-3); }
.row.off { opacity: .55; }
.swatch { width: 56px; height: 56px; border-radius: 50%; background: var(--tray); overflow: hidden; display: grid; place-items: center; }
.swatch img { width: 100%; height: 100%; object-fit: cover; }
.bead { border-radius: 50%; box-shadow: inset -3px -4px 6px rgba(0,0,0,.18), 0 2px 4px rgba(31,27,26,.18); }
.panel { background: var(--surface); border-radius: 16px; padding: 20px; display: grid; gap: 14px; position: sticky; top: 80px; max-height: calc(100vh - 104px); overflow: auto; }
.panel .empty { color: var(--ink-3); text-align: center; padding: 40px 0; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .wide { grid-column: 1 / -1; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
label.f.bad input { border-color: var(--danger); }
input[type=text], input[type=number], input[type=search], select, textarea { width: 100%; height: 36px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 10px; font: 400 14px/20px var(--font-sans); background: var(--surface); color: var(--ink); }
textarea { height: 64px; padding: 8px 10px; resize: vertical; }
input[type=datetime-local] { width: 100%; height: 36px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 8px; font: 400 13px/20px var(--font-sans); background: var(--surface); color: var(--ink); }
input[type=color] { width: 100%; height: 36px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px; background: var(--surface); }
.check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink); }
.check input { accent-color: var(--brand); width: 16px; height: 16px; }
.photo { display: flex; gap: 12px; align-items: center; }
.photo .ph { width: 72px; height: 72px; border-radius: 12px; background: var(--tray); overflow: hidden; display: grid; place-items: center; color: var(--ink-3); font-size: 12px; flex: none; }
.photo .ph img { width: 100%; height: 100%; object-fit: cover; }
.photo .tips { font-size: 12px; color: var(--ink-3); line-height: 18px; }
.err { color: var(--danger); font-size: 13px; min-height: 18px; }
.kbcard { grid-column: 1 / -1; background: var(--tray); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; font-size: 13px; line-height: 1.6; }
.kbcard b { font-size: 14px; }
.kbcard .muted { color: var(--ink-2); }
.kbcard .warn { color: var(--danger); font-weight: 600; }
.points { display: flex; flex-wrap: wrap; gap: 6px; }
.points span { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; font-size: 12.5px; }
.dimgrid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .dimgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ok { color: var(--fit-ok); }
.preview { background: radial-gradient(circle at 50% 45%, var(--tray), var(--tray-deep)); border-radius: 16px; display: grid; place-items: center; padding: 16px; gap: 8px; }
.ring { position: relative; width: 220px; height: 220px; }
.ring .bead { position: absolute; }
.preview .meta { font: 500 13px/18px var(--font-num); color: var(--ink-2); }
.seq { display: grid; gap: 6px; }
.seq .lab { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; }
.seq .items { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; padding: 6px; border: 1px dashed var(--line-strong); border-radius: 8px; }
.seq .it { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 6px 0 4px; border-radius: 999px; background: var(--tray); font-size: 12px; }
.seq .it i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
.seq .it button { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 14px; padding: 0 2px; }
.seq select { height: 30px; font-size: 13px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
th { color: var(--ink-2); font-weight: 600; background: var(--ground); white-space: nowrap; }
td .num { font-family: var(--font-num); }
.tblwrap { overflow-x: auto; background: var(--surface); border-radius: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; background: var(--tray); color: var(--ink-2); margin-right: 4px; line-height: 18px; }
.tag-ok { background: #e7f4ec; color: #2b7a4b; }
.tag-warn { background: #fdf1e3; color: #9a5800; }
.tag-danger { background: #fbecea; color: #b42318; }
.tag-info { background: #e8f0fb; color: #2b5fa3; }
.tag-gray { background: #efece8; color: #736b66; }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; margin-left: 4px; }
.badge.warn { background: #fdf1e3; color: #9a5800; border: 1px solid #e6c9a0; }
.warn-inline { color: var(--danger); font-size: 12px; line-height: 1.5; }
.muted { color: var(--ink-3); }
.sm { font-size: 12px; }
/* 多图管理 */
.imgrid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.imgcell { display: grid; gap: 6px; align-content: start; }
.imgthumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--tray); }
.imgthumb img { width: 100%; height: 100%; object-fit: cover; }
.cover-badge { position: absolute; left: 0; bottom: 0; background: var(--brand); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 0 6px 0 0; }
.imgops { display: flex; flex-wrap: wrap; gap: 4px; }
.mini { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; font-size: 11px; padding: 1px 5px; cursor: pointer; color: var(--ink-2); }
.mini.danger { color: var(--danger); border-color: var(--danger); }
.mini:disabled { opacity: .4; cursor: default; }
.imgadd { grid-column: 1 / -1; display: grid; place-items: center; border: 1px dashed var(--line-strong); border-radius: 10px; height: 64px; color: var(--ink-3); cursor: pointer; font-size: 13px; }
/* 弹窗 */
.modal { position: fixed; inset: 0; z-index: 90; background: #0005; display: grid; place-items: center; padding: 16px; }
.modal-box { background: #fff; border-radius: 16px; padding: 20px; width: min(520px, 92vw); max-height: 86vh; overflow: auto; display: grid; gap: 14px; }
.modal-box .mbody { display: grid; gap: 10px; font-size: 14px; color: var(--ink); line-height: 1.6; }
/* 订单详情 / 时间线 */
.detail { display: grid; gap: 12px; padding: 4px 2px; }
.dhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.sgroup { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: var(--ground); }
.shead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.slab { font-size: 12px; color: var(--ink-2); }
.sbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.drow { display: grid; gap: 4px; font-size: 13px; }
.timeline { display: grid; gap: 10px; margin-top: 4px; }
.tl { display: flex; gap: 10px; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); margin-top: 6px; flex: none; }
.toast { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); background: rgba(31,27,26,.9); color: #fff; padding: 8px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
[hidden] { display: none !important; }
.login-overlay { position: fixed; inset: 0; z-index: 100; background: #0005; display: grid; place-items: center; }
.login-box { background: white; padding: 28px; border-radius: 16px; width: min(380px, 90vw); display: grid; gap: 16px; }
.empty { color: var(--ink-3); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>串个珠后台</h1>
  <nav id="tabs">
    <button data-t="beads" class="on">商品</button>
    <button data-t="templates">模板</button>
    <button data-t="orders">订单</button>
    <button data-t="aftersales">售后</button>
    <button data-t="logistics">物流</button>
    <button data-t="terms">服务条款</button>
    <button data-t="audit">操作审计</button>
    <button data-t="banners">宣传位</button>
  </nav>
  <div class="right"><span class="ai-state" id="aiState">AI：检查中</span><a href="/" target="_blank">打开前台 ›</a></div>
</header>
<main id="main">
  <section><div class="bar" id="bar"></div><div id="list"></div></section>
  <aside class="panel" id="panel"><div class="empty">在左边选一条，或者点“新建”</div></aside>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>
<div id="adminLogin" class="login-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="loginTitle">
<form id="loginForm" class="login-box">
<h2 id="loginTitle">登录管理后台</h2>
<label for="adminPassword">后台口令</label>
<input id="adminPassword" type="password" autocomplete="current-password" required>
<div id="loginError" class="err" role="alert"></div>
<button id="loginSubmit" class="btn" type="submit">登录</button>
</form></div>

<script src="/admin/common.js"></script>
<script src="/admin/products.js"></script>
<script src="/admin/templates.js"></script>
<script src="/admin/orders.js"></script>
<script src="/admin/after-sales.js"></script>
<script src="/admin/logistics.js"></script>
<script src="/admin/terms.js"></script>
<script src="/admin/audit.js"></script>
<script src="/admin/banners.js"></script>
<script>
$('tabs').onclick = async e => {
  const t = e.target.dataset.t; if (!t) return;
  tab = t; editing = null;
  $('panel').innerHTML = '<div class="empty">在左边选一条，或者点“新建”</div>';
  await load(t); render();
};
(async () => {
  try {
    await Promise.all(['beads', 'templates', 'banners', 'orders', 'aftersales', 'terms', 'audit'].map(load));
    try { [KB, KBA] = await Promise.all([api('GET', '/api/kb/index'), api('GET', '/api/kb/attributes')]); } catch {}
    const s = await (await fetch('/api/ai/status')).json();
    $('aiState').textContent = s.enabled ? `AI：${s.provider} · ${s.model}` : 'AI：未配置（用本地规则）';
    $('aiState').classList.toggle('on', !!s.enabled);
    render();
  } catch (err) { $('list').innerHTML = `<div class="err">加载失败：${esc(err.message)}</div>`; }
})();
</script>
</body>
</html>
